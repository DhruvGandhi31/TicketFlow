name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# no point running two CI runs for the same branch if a newer push already superseded it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore TicketFlow.sln

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Verify code formatting
        run: dotnet format TicketFlow.sln --verify-no-changes

      # catches the classic "changed a model, forgot to add a migration" mistake before it merges -
      # one check per service now that events/seats each have their own db and their own migrations
      - name: Verify EF Core migrations are up to date (Events)
        run: dotnet ef migrations has-pending-model-changes --project src/TicketFlow.Events.Api

      - name: Verify EF Core migrations are up to date (Seats)
        run: dotnet ef migrations has-pending-model-changes --project src/TicketFlow.Seats.Api

      - name: Build
        run: dotnet build TicketFlow.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test TicketFlow.sln --no-build --configuration Release --logger "console;verbosity=normal"

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # just proves each Dockerfile actually produces an image - doesn't push anywhere yet,
      # that's a later phase once there's somewhere real to push to
      - name: Build Events image
        run: docker build -f src/TicketFlow.Events.Api/Dockerfile -t ticketflow-events-api .

      - name: Build Seats image
        run: docker build -f src/TicketFlow.Seats.Api/Dockerfile -t ticketflow-seats-api .

      - name: Build Gateway image
        run: docker build -f src/TicketFlow.Gateway/Dockerfile -t ticketflow-gateway .
